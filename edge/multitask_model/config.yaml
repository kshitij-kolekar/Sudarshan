# ============================================================
# RGB-only multi-task pothole model - configuration
# ============================================================
seed: 42

data:
  root: "D:/drone/POTHOLE_TRAINING_DATASET"
  image_size: [512, 384]          # [W, H] - aspect-preserving 0.8x of the
                                  # native 640x480 (keeps metric geometry intact)
  workers: 0                      # Windows: 0 workers avoids DataLoader paging hangs
  depth_noise_floor_m: 0.003      # sub-noise cavity is treated as 'no valid depth'
  depth_clip_m: 0.30              # hard cap for predicted cavity depth (m)
  abs_depth_valid_range_m: [0.05, 5.0]   # invalid: 0 / 65535 / non-finite / outside
  abs_depth_max_m: 6.0            # absolute-depth head sigmoid scale (m)
  abs_depth_split_m: 1.0          # 'near' vs 'farther' depth threshold (m)

intrinsics:                       # provisional D415 defaults, calibrated at 640x480
  fx: 597.5
  fy: 597.5
  cx: 319.5
  cy: 239.5
  orig_w: 640
  orig_h: 480

model:
  backbone: mobilenetv3_small     # ImageNet-pretrained torchvision weights
  pretrained: true                # falls back to random init if download fails
  seg_weight_bce: 1.0
  seg_weight_dice: 1.0
  dims: [length_m, width_m, area_m2, mean_depth_m, p90_depth_m, plane_dist_m]   # required dims
  dims_aux: [median_depth_m, p99_depth_m, max_depth_m]            # aux dims (no loss)
  volume_reg_head: true           # auxiliary direct volume head (not primary)
  abs_depth_head: true            # dense absolute metric depth head (Stage 2.1)
  abs_depth_grad_lambda: 0.1      # edge-aware TV term on valid abs-depth px (0=off)

loss:
  lambda_seg: 1.0
  lambda_depth: 1.0               # cavity-depth head weight
  lambda_abs_depth: 2.0           # absolute metric depth head weight
  lambda_dim: 1.0
  lambda_volume: 0.5              # auxiliary volume regression weight
  depth_loss: smooth_l1           # smooth_l1 | clamp_smooth_l1
  dim_loss: smooth_l1

augmentation:
  hflip_p: 0.5
  brightness: 0.35
  contrast: 0.35
  saturation: 0.30
  rot_deg: 10.0
  scale: [0.90, 1.10]
  translate: 0.10
  blur_p: 0.15
  noise_p: 0.10

train:
  epochs: 60
  batch_size: 16
  base_lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_epochs: 2
  cosine_eta_min: 1.0e-5
  max_grad_norm: 5.0
  amp: true
  early_stop_patience: 15
  checkpoint_best: "best.pt"
  checkpoint_last: "last.pt"
  select_metric: "seg_iou"        # best checkpoint is chosen on VAL seg IoU
  log_every: 10

validate:
  depth_validity: "gt"            # evaluate depth over ground-truth valid pixels
  metric_depth: true

test:
  write_outputs: true

inference:
  mask_threshold: 0.5

geometry:                         # road-plane fitting from predicted abs depth
  ransac_iter: 250
  ransac_tol_m: 0.05              # inlier tolerance (predicted depth is noisier than GT)
  min_road_candidates: 300
  min_inliers: 150
  min_abs_nz: 0.35                # plane normal must be mostly along the camera axis
  edge_crop: 8                    # ignore border ring when fitting the plane
  dilate_ks: 11                   # mask dilation kernel (exclude pothole boundary)